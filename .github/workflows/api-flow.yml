name: API publish flow

on:
  workflow_dispatch:
    inputs:
      increment:
        type: choice
        description: The version/prerelease increment. 'release' simply removes the prerelease mark, or increments the prerelease counter if marked as prerelease.
        required: true
        options:
          - none
          - release
          - patch
          - minor
          - major
          - prerelease
          - prepatch
          - preminor
          - premajor
      preid:
        type: choice
        description: The preid
        required: false
        options:
          - pre
          - rc
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm registry (API types)
      url: https://npmx.dev/package/@vsc-neuropilot/api-types
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Validate inputs
        run: |
          # Check if increment requires preid
          case "${{ inputs.increment }}" in
            prerelease|prepatch|preminor|premajor)
              if [ "${{ inputs.preid }}" = "" ]; then
                echo "Error: preid is required when increment is ${{ inputs.increment }}"
                exit 1
              fi
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: "pnpm"
          cache-dependency-path: "./pnpm-lock.yaml"
          registry-url: https://registry.npmjs.org

      - name: Install deps
        run: |
          pnpm install --frozen-lockfile

      - name: Version types
        if: inputs.increment != 'none'
        run: |
          git config set user.name "GitHub Actions"
          git config set user.email actions@github.com

          cd packages/types

          if [ "${{ inputs.preid }}" != "" ]; then
            GIT_TAG=$(pnpm version ${{ inputs.increment }} --no-git-tag-version --preid ${{ inputs.preid }})
          else
            GIT_TAG=$(pnpm version ${{ inputs.increment }} --no-git-tag-version)
          fi

          VERSION=$(pnpm show ./ version)
          git add package.json
          git commit -nm "bump api to v$VERSION"
          git tag "$GIT_TAG"

          git push --follow-tags

      - name: Publish types package
        run: |
          cd packages/types

          if [ "${{ inputs.preid }}" != "" ]; then
            pnpm publish --access public --no-git-checks --tag prerelease
          else
            pnpm publish --access public --no-git-checks --tag latest
          fi

          echo "Finished publishing."
